<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="evidaBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <clipPath id="leftCardClip">
      <rect width="280" height="360" rx="20" ry="20"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#evidaBg)"/>

  <!-- Left Card: Event Showcase -->
  <g transform="translate(90, 45)">
    <!-- Base card -->
    <rect width="280" height="360" rx="20" ry="20" fill="#ffffff"/>

    <g clip-path="url(#leftCardClip)">
      <!-- Top banner image area -->
      <rect width="280" height="110" fill="#818cf8"/>
      <circle cx="140" cy="55" r="26" fill="#ffffff" fill-opacity="0.25"/>

      <!-- Vector calendar symbol -->
      <rect x="126" y="43" width="28" height="24" rx="4" fill="none" stroke="#ffffff" stroke-width="2.5"/>
      <line x1="133" y1="39" x2="133" y2="45" stroke="#ffffff" stroke-width="2.5"/>
      <line x1="147" y1="39" x2="147" y2="45" stroke="#ffffff" stroke-width="2.5"/>
      <line x1="126" y1="51" x2="154" y2="51" stroke="#ffffff" stroke-width="2.5"/>
    </g>

    <!-- Date pill -->
    <rect x="20" y="85" width="75" height="44" rx="10" fill="#18181b"/>
    <text x="57" y="102" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="11" fill="#f43f5e">OCT</text>
    <text x="57" y="122" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="16" fill="#ffffff">24</text>

    <!-- Details -->
    <text x="20" y="158" font-family="sans-serif" font-weight="800" font-size="16" fill="#111827">Campus AI &amp; Tech Summit</text>
    <text x="20" y="180" font-family="sans-serif" font-weight="600" font-size="12" fill="#6b7280">Student Union Auditorium</text>
    <text x="20" y="200" font-family="sans-serif" font-weight="600" font-size="12" fill="#6b7280">5:30 PM - 8:00 PM</text>

    <!-- Attendees Pill -->
    <rect x="20" y="225" width="130" height="28" rx="14" fill="#f3f4f6"/>
    <circle cx="34" cy="239" r="8" fill="#ec4899"/>
    <circle cx="48" cy="239" r="8" fill="#8b5cf6"/>
    <circle cx="62" cy="239" r="8" fill="#3b82f6"/>
    <text x="78" y="243" font-family="sans-serif" font-weight="700" font-size="11" fill="#374151">+142 Attending</text>

    <!-- RSVP Button -->
    <rect x="20" y="280" width="240" height="44" rx="22" fill="#4f46e5"/>
    <text x="140" y="307" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="14" fill="#ffffff">RSVP Confirmed</text>
  </g>

  <!-- Right Card: Mobile Feed -->
  <g transform="translate(420, 55)">
    <rect width="290" height="340" rx="22" ry="22" fill="#0f172a" stroke="#334155" stroke-width="2"/>

    <rect x="30" y="22" width="60" height="12" rx="6" fill="#334155"/>
    <circle cx="255" cy="28" r="6" fill="#22c55e"/>

    <text x="30" y="65" font-family="sans-serif" font-weight="800" font-size="20" fill="#ffffff">Discover Events</text>
    <text x="30" y="85" font-family="sans-serif" font-weight="600" font-size="12" fill="#94a3b8">Livingstone College Campus</text>

    <!-- Tabs -->
    <rect x="30" y="105" width="60" height="26" rx="13" fill="#6366f1"/>
    <text x="60" y="122" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="11" fill="#ffffff">All</text>

    <rect x="100" y="105" width="75" height="26" rx="13" fill="#1e293b"/>
    <text x="137" y="122" text-anchor="middle" font-family="sans-serif" font-weight="600" font-size="11" fill="#94a3b8">Academic</text>

    <rect x="185" y="105" width="65" height="26" rx="13" fill="#1e293b"/>
    <text x="217" y="122" text-anchor="middle" font-family="sans-serif" font-weight="600" font-size="11" fill="#94a3b8">Sports</text>

    <!-- Mini Feed 1 -->
    <g transform="translate(30, 150)">
      <rect width="230" height="68" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <rect x="12" y="12" width="44" height="44" rx="10" fill="#f59e0b"/>
      <circle cx="34" cy="34" r="10" fill="#ffffff" fill-opacity="0.4"/>
      <text x="68" y="32" font-family="sans-serif" font-weight="700" font-size="13" fill="#ffffff">Varsity Tennis Match</text>
      <text x="68" y="48" font-family="sans-serif" font-weight="600" font-size="11" fill="#38bdf8">Tomorrow - 3:00 PM</text>
    </g>

    <!-- Mini Feed 2 -->
    <g transform="translate(30, 230)">
      <rect width="230" height="68" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <rect x="12" y="12" width="44" height="44" rx="10" fill="#10b981"/>
      <circle cx="34" cy="34" r="10" fill="#ffffff" fill-opacity="0.4"/>
      <text x="68" y="32" font-family="sans-serif" font-weight="700" font-size="13" fill="#ffffff">CIS Hackathon Kickoff</text>
      <text x="68" y="48" font-family="sans-serif" font-weight="600" font-size="11" fill="#34d399">Friday - 6:00 PM</text>
    </g>
  </g>
</svg>
