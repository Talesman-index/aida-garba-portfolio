<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="mcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="50%" stop-color="#fee2e2"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </linearGradient>
    <filter id="mcShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#mcBg)"/>

  <!-- Main Analytics Board -->
  <g filter="url(#mcShadow)" transform="translate(60, 40)">
    <rect width="680" height="370" rx="20" fill="#ffffff" stroke="#fecdd3" stroke-width="1.5"/>

    <!-- Header Bar -->
    <g transform="translate(30, 24)">
      <!-- Mastercard Icon Mark -->
      <circle cx="20" cy="18" r="16" fill="#eb001b" opacity="0.9"/>
      <circle cx="38" cy="18" r="16" fill="#f79e1b" opacity="0.9"/>
      <text x="68" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="17" fill="#111827">Mastercard Inclusive Growth Challenge</text>
      <text x="68" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="12" fill="#6b7280">Rural Healthcare Testing Disparities • Robeson County, NC</text>

      <rect x="520" y="6" width="100" height="28" rx="14" fill="#fee2e2"/>
      <text x="570" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="11" fill="#e11d48">FINALIST TEAM</text>
    </g>

    <line x1="30" y1="80" x2="650" y2="80" stroke="#f1f5f9" stroke-width="1.5"/>

    <!-- Left Chart Area: Scatter Plot & Regression Line -->
    <g transform="translate(40, 105)">
      <text x="0" y="15" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="13" fill="#374151">DISTANCE TO CLINIC VS. DIAGNOSTIC DELAY (DAYS)</text>
      
      <!-- Chart Background & Axes Grid -->
      <rect x="0" y="30" width="360" height="180" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <line x1="30" y1="50" x2="340" y2="50" stroke="#e2e8f0" stroke-dasharray="4,4"/>
      <line x1="30" y1="90" x2="340" y2="90" stroke="#e2e8f0" stroke-dasharray="4,4"/>
      <line x1="30" y1="130" x2="340" y2="130" stroke="#e2e8f0" stroke-dasharray="4,4"/>
      <line x1="30" y1="170" x2="340" y2="170" stroke="#e2e8f0" stroke-dasharray="4,4"/>

      <!-- Axes -->
      <line x1="30" y1="40" x2="30" y2="190" stroke="#94a3b8" stroke-width="1.5"/>
      <line x1="30" y1="190" x2="340" y2="190" stroke="#94a3b8" stroke-width="1.5"/>

      <!-- Regression Trendline -->
      <line x1="45" y1="170" x2="320" y2="60" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
      <polygon points="45,170 320,60 320,80 45,185" fill="#ef4444" opacity="0.12"/>

      <!-- Data Points (Scatter Dots) -->
      <circle cx="50" cy="165" r="5" fill="#f97316"/>
      <circle cx="70" cy="155" r="6" fill="#ef4444"/>
      <circle cx="95" cy="160" r="5" fill="#ec4899"/>
      <circle cx="110" cy="140" r="7" fill="#f97316"/>
      <circle cx="130" cy="145" r="6" fill="#ef4444"/>
      <circle cx="160" cy="120" r="7" fill="#dc2626"/>
      <circle cx="175" cy="130" r="5" fill="#f97316"/>
      <circle cx="195" cy="105" r="8" fill="#ef4444"/>
      <circle cx="215" cy="115" r="6" fill="#f97316"/>
      <circle cx="240" cy="90" r="7" fill="#dc2626"/>
      <circle cx="260" cy="85" r="8" fill="#ef4444"/>
      <circle cx="280" cy="95" r="6" fill="#f97316"/>
      <circle cx="305" cy="65" r="8" fill="#dc2626"/>

      <!-- Chart Labels -->
      <text x="30" y="206" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="10" fill="#64748b">0 mi</text>
      <text x="175" y="206" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="10" fill="#64748b">15 mi</text>
      <text x="320" y="206" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="10" fill="#64748b">30+ mi</text>
    </g>

    <!-- Right KPI Cards Area -->
    <g transform="translate(430, 105)">
      <!-- KPI 1 -->
      <rect width="210" height="66" rx="12" fill="#fff1f2" stroke="#fecdd3" stroke-width="1"/>
      <text x="16" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#e11d48">ACCESS DEFICIT</text>
      <text x="16" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="24" fill="#9f1239">42.8%</text>
      <text x="110" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="11" fill="#e11d48">Rural Gap</text>

      <!-- KPI 2 -->
      <rect y="76" width="210" height="66" rx="12" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
      <text x="16" y="100" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#ea580c">TEST RESULT LATENCY</text>
      <text x="16" y="128" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="24" fill="#9a3412">5.4 Days</text>
      <text x="135" y="128" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="11" fill="#ea580c">Avg Delay</text>

      <!-- KPI 3 Solution -->
      <rect y="152" width="210" height="66" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
      <text x="16" y="176" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#16a34a">PROPOSED INTERVENTION</text>
      <text x="16" y="196" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="14" fill="#14532d">Smart Diagnostic Hubs</text>
      <text x="16" y="210" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="11" fill="#16a34a">75% reduction in wait time</text>
    </g>
  </g>
</svg>
