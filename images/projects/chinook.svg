<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="chinookBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <filter id="chinookShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#chinookBg)"/>

  <!-- Analytics & SQL Board -->
  <g filter="url(#chinookShadow)" transform="translate(60, 40)">
    <rect width="680" height="370" rx="20" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/>

    <!-- Header Bar -->
    <g transform="translate(30, 24)">
      <!-- Music & Database icon -->
      <circle cx="20" cy="18" r="18" fill="#4338ca"/>
      <text x="20" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="16" fill="#ffffff">🎵</text>
      
      <text x="50" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="17" fill="#111827">Chinook SQL Database Analysis</text>
      <text x="50" y="40" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="12" fill="#6b7280">Digital Music Store • Relational Schema &amp; Sales BI</text>

      <rect x="520" y="6" width="120" height="28" rx="14" fill="#e0e7ff"/>
      <text x="580" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="11" fill="#4338ca">SQL BI QUERIES</text>
    </g>

    <line x1="30" y1="78" x2="650" y2="78" stroke="#f1f5f9" stroke-width="1.5"/>

    <!-- Left Box: Code Snippet & Relational Schema -->
    <g transform="translate(30, 100)">
      <rect width="290" height="235" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      
      <!-- Terminal dots -->
      <circle cx="18" cy="18" r="5" fill="#ef4444"/>
      <circle cx="32" cy="18" r="5" fill="#eab308"/>
      <circle cx="46" cy="18" r="5" fill="#22c55e"/>
      <text x="145" y="22" text-anchor="middle" font-family="monospace" font-size="10" fill="#94a3b8">query_genre_revenue.sql</text>

      <!-- Code Text -->
      <text x="16" y="52" font-family="monospace" font-size="11" fill="#38bdf8">SELECT</text>
      <text x="65" y="52" font-family="monospace" font-size="11" fill="#f8fafc">g.Name AS Genre,</text>
      
      <text x="28" y="72" font-family="monospace" font-size="11" fill="#38bdf8">SUM</text>
      <text x="48" y="72" font-family="monospace" font-size="11" fill="#f8fafc">(il.UnitPrice * il.Qty) AS Rev</text>

      <text x="16" y="94" font-family="monospace" font-size="11" fill="#38bdf8">FROM</text>
      <text x="52" y="94" font-family="monospace" font-size="11" fill="#f8fafc">InvoiceLine il</text>

      <text x="16" y="116" font-family="monospace" font-size="11" fill="#c084fc">JOIN</text>
      <text x="48" y="116" font-family="monospace" font-size="11" fill="#f8fafc">Track t ON il.TrackId = t.Id</text>

      <text x="16" y="138" font-family="monospace" font-size="11" fill="#c084fc">JOIN</text>
      <text x="48" y="138" font-family="monospace" font-size="11" fill="#f8fafc">Genre g ON t.GenreId = g.Id</text>

      <text x="16" y="160" font-family="monospace" font-size="11" fill="#38bdf8">GROUP BY</text>
      <text x="76" y="160" font-family="monospace" font-size="11" fill="#f8fafc">g.Name</text>

      <text x="16" y="182" font-family="monospace" font-size="11" fill="#38bdf8">ORDER BY</text>
      <text x="76" y="182" font-family="monospace" font-size="11" fill="#f8fafc">Rev DESC LIMIT 5;</text>

      <rect x="16" y="198" width="258" height="24" rx="6" fill="#1e293b"/>
      <text x="24" y="214" font-family="monospace" font-size="10" fill="#34d399">✓ 11 Tables Joined • 0.04s execution</text>
    </g>

    <!-- Right Box: Bar Chart Revenue by Genre (similar to reference Card 3) -->
    <g transform="translate(345, 100)">
      <rect width="305" height="235" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="20" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="12" fill="#374151">TOP MUSIC GENRES BY GLOBAL REVENUE</text>

      <!-- Bar Chart Grid -->
      <line x1="20" y1="50" x2="285" y2="50" stroke="#e2e8f0" stroke-dasharray="3,3"/>
      <line x1="20" y1="95" x2="285" y2="95" stroke="#e2e8f0" stroke-dasharray="3,3"/>
      <line x1="20" y1="140" x2="285" y2="140" stroke="#e2e8f0" stroke-dasharray="3,3"/>
      <line x1="20" y1="185" x2="285" y2="185" stroke="#94a3b8" stroke-width="1.5"/>

      <!-- Bar 1: Rock -->
      <rect x="35" y="60" width="38" height="125" rx="6" fill="#4338ca"/>
      <text x="54" y="52" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="11" fill="#4338ca">$826</text>
      <text x="54" y="202" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="10" fill="#64748b">Rock</text>

      <!-- Bar 2: Latin -->
      <rect x="88" y="90" width="38" height="95" rx="6" fill="#06b6d4"/>
      <text x="107" y="82" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="11" fill="#06b6d4">$382</text>
      <text x="107" y="202" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="10" fill="#64748b">Latin</text>

      <!-- Bar 3: Metal -->
      <rect x="141" y="115" width="38" height="70" rx="6" fill="#8b5cf6"/>
      <text x="160" y="107" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="11" fill="#8b5cf6">$261</text>
      <text x="160" y="202" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="10" fill="#64748b">Metal</text>

      <!-- Bar 4: Alternative -->
      <rect x="194" y="135" width="38" height="50" rx="6" fill="#10b981"/>
      <text x="213" y="127" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="11" fill="#10b981">$241</text>
      <text x="213" y="202" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="10" fill="#64748b">Alt</text>

      <!-- Bar 5: Jazz -->
      <rect x="247" y="150" width="38" height="35" rx="6" fill="#f59e0b"/>
      <text x="266" y="142" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="11" fill="#f59e0b">$158</text>
      <text x="266" y="202" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="10" fill="#64748b">Jazz</text>

      <!-- Top Country Metric -->
      <text x="20" y="224" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="10" fill="#4338ca">Top Country Revenue: USA ($523) • Canada ($303)</text>
    </g>
  </g>
</svg>
