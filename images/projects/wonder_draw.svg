<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="wonderBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="neonBrush" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="35%" stop-color="#8b5cf6"/>
      <stop offset="70%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="wonderGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#wonderBg)"/>

  <!-- Left Canvas: User Doodling Input -->
  <g transform="translate(60, 45)">
    <rect width="320" height="360" rx="20" fill="#27272a" stroke="#3f3f46" stroke-width="1.5"/>
    <text x="24" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="14" fill="#a1a1aa">INPUT CANVAS • DOODLE</text>
    <rect x="235" y="20" width="65" height="24" rx="12" fill="#3f3f46"/>
    <text x="267" y="36" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#e4e4e7">Pencil</text>

    <!-- Sketch lines -->
    <path d="M 60,180 Q 90,90 160,100 T 260,190 Q 230,270 150,260 Z" fill="none" stroke="#71717a" stroke-width="4" stroke-dasharray="6,4"/>
    <circle cx="120" cy="160" r="12" fill="none" stroke="#71717a" stroke-width="3"/>
    <circle cx="200" cy="160" r="12" fill="none" stroke="#71717a" stroke-width="3"/>
    <path d="M 130,210 Q 160,240 190,210" fill="none" stroke="#71717a" stroke-width="3"/>

    <!-- Tool Palette -->
    <g transform="translate(24, 305)">
      <circle cx="16" cy="16" r="14" fill="#ec4899"/>
      <circle cx="52" cy="16" r="14" fill="#8b5cf6"/>
      <circle cx="88" cy="16" r="14" fill="#06b6d4"/>
      <circle cx="124" cy="16" r="14" fill="#10b981"/>
      <circle cx="160" cy="16" r="14" fill="#eab308"/>
      <rect x="195" y="2" width="75" height="28" rx="14" fill="#3b82f6"/>
      <text x="232" y="20" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#ffffff">Draw ✎</text>
    </g>
  </g>

  <!-- Center Transformation Arrow -->
  <g transform="translate(390, 205)">
    <circle cx="10" cy="10" r="22" fill="#8b5cf6" filter="url(#wonderGlow)"/>
    <text x="10" y="16" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="16" fill="#ffffff">✨</text>
  </g>

  <!-- Right Canvas: Generative AI Render Output -->
  <g transform="translate(420, 45)">
    <rect width="320" height="360" rx="20" fill="#1e1e24" stroke="#8b5cf6" stroke-width="2"/>
    <text x="24" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="14" fill="#c084fc">AI GENERATED • REALTIME</text>
    <rect x="235" y="20" width="65" height="24" rx="12" fill="#8b5cf6"/>
    <text x="267" y="36" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#ffffff">Rendered</text>

    <!-- Vibrant Artwork Result -->
    <path d="M 60,180 Q 90,80 160,95 T 260,185 Q 235,275 150,265 Z" fill="url(#neonBrush)" filter="url(#wonderGlow)" opacity="0.9"/>
    
    <!-- Stylized Features -->
    <circle cx="120" cy="155" r="14" fill="#ffffff"/>
    <circle cx="122" cy="155" r="7" fill="#0f172a"/>
    <circle cx="125" cy="152" r="3" fill="#ffffff"/>

    <circle cx="200" cy="155" r="14" fill="#ffffff"/>
    <circle cx="202" cy="155" r="7" fill="#0f172a"/>
    <circle cx="205" cy="152" r="3" fill="#ffffff"/>

    <path d="M 125,205 Q 160,245 195,205" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>

    <!-- Sparkles -->
    <text x="70" y="110" font-size="20">✨</text>
    <text x="240" y="120" font-size="22">🌟</text>
    <text x="245" y="250" font-size="18">⚡</text>

    <!-- Bottom Prompt Pill -->
    <rect x="20" y="305" width="280" height="34" rx="17" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="35" y="327" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="12" fill="#38bdf8">Prompt: "Playful neon 3D cosmic companion"</text>
  </g>
</svg>
