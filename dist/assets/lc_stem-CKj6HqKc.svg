<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="lcStemBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="emeraldCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="lcStemShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="450" fill="url(#lcStemBg)"/>

  <!-- Science/Math Constellation Network -->
  <g opacity="0.25" stroke="#34d399" stroke-width="1.5">
    <line x1="80" y1="120" x2="200" y2="80"/>
    <line x1="200" y1="80" x2="320" y2="140"/>
    <line x1="200" y1="80" x2="180" y2="240"/>
    <line x1="180" y1="240" x2="280" y2="340"/>
    <line x1="320" y1="140" x2="480" y2="100"/>
    <line x1="480" y1="100" x2="620" y2="160"/>
    <line x1="620" y1="160" x2="720" y2="100"/>
    <line x1="620" y1="160" x2="580" y2="300"/>
    <line x1="580" y1="300" x2="700" y2="360"/>
    <circle cx="80" cy="120" r="5" fill="#34d399"/>
    <circle cx="200" cy="80" r="7" fill="#6ee7b7"/>
    <circle cx="320" cy="140" r="5" fill="#34d399"/>
    <circle cx="180" cy="240" r="6" fill="#10b981"/>
    <circle cx="280" cy="340" r="7" fill="#6ee7b7"/>
    <circle cx="480" cy="100" r="6" fill="#34d399"/>
    <circle cx="620" cy="160" r="8" fill="#6ee7b7"/>
    <circle cx="720" cy="100" r="5" fill="#34d399"/>
    <circle cx="580" cy="300" r="7" fill="#10b981"/>
    <circle cx="700" cy="360" r="6" fill="#34d399"/>
  </g>

  <!-- Central Glassmorphism Portal Dashboard -->
  <g filter="url(#lcStemShadow)" transform="translate(130, 45)">
    <rect width="540" height="360" rx="20" fill="#ffffff" fill-opacity="0.95" stroke="#e2e8f0" stroke-width="1.5"/>

    <!-- Dashboard Top Bar -->
    <rect x="0" y="0" width="540" height="60" rx="20" fill="#0f172a"/>
    <rect x="0" y="40" width="540" height="20" fill="#0f172a"/>
    <circle cx="30" cy="30" r="14" fill="#10b981"/>
    <text x="30" y="35" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="12" fill="#ffffff">LC</text>
    <text x="56" y="35" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="16" fill="#ffffff">Livingstone STEM Research &amp; Tutoring Portal</text>
    <rect x="420" y="18" width="95" height="26" rx="13" fill="#1e293b"/>
    <text x="467" y="34" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#34d399">ACTIVE TERM</text>

    <!-- 3 Stat Widgets Row -->
    <g transform="translate(30, 80)">
      <!-- Stat 1 -->
      <rect width="145" height="74" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="16" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="11" fill="#64748b">ACTIVE TUTORS</text>
      <text x="16" y="56" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="24" fill="#0f172a">48</text>
      <text x="58" y="56" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#10b981">↑ 100% On-Duty</text>

      <!-- Stat 2 -->
      <rect x="165" width="145" height="74" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="181" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="11" fill="#64748b">RESEARCH LABS</text>
      <text x="181" y="56" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="24" fill="#0f172a">12</text>
      <text x="218" y="56" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#3b82f6">All Available</text>

      <!-- Stat 3 -->
      <rect x="330" width="150" height="74" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="346" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="11" fill="#64748b">PEER SESSIONS</text>
      <text x="346" y="56" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="24" fill="#0f172a">520+</text>
      <text x="412" y="56" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#10b981">Completed</text>
    </g>

    <!-- Lower Section: Department Scheduling Table -->
    <g transform="translate(30, 175)">
      <text x="0" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="14" fill="#0f172a">Department Tutoring &amp; Lab Schedules</text>
      
      <!-- Table Header -->
      <rect x="0" y="28" width="480" height="28" rx="6" fill="#f1f5f9"/>
      <text x="15" y="46" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#475569">DISCIPLINE</text>
      <text x="160" y="46" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#475569">LEAD MENTOR</text>
      <text x="310" y="46" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#475569">HOURS</text>
      <text x="420" y="46" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#475569">STATUS</text>

      <!-- Row 1 -->
      <line x1="0" y1="92" x2="480" y2="92" stroke="#f1f5f9" stroke-width="1"/>
      <text x="15" y="78" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#0f172a">Computer Info Systems</text>
      <text x="160" y="78" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="12" fill="#334155">Aïda Garba (CIS Peer)</text>
      <text x="310" y="78" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="12" fill="#334155">Mon - Thu</text>
      <rect x="410" y="65" width="60" height="20" rx="10" fill="#dcfce7"/>
      <text x="440" y="79" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="10" fill="#15803d">OPEN</text>

      <!-- Row 2 -->
      <line x1="0" y1="126" x2="480" y2="126" stroke="#f1f5f9" stroke-width="1"/>
      <text x="15" y="112" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#0f172a">Data Analytics &amp; Math</text>
      <text x="160" y="112" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="12" fill="#334155">Peer Coaching Team</text>
      <text x="310" y="112" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="12" fill="#334155">Tue &amp; Fri</text>
      <rect x="410" y="99" width="60" height="20" rx="10" fill="#dbeafe"/>
      <text x="440" y="113" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="10" fill="#1d4ed8">BOOKED</text>
    </g>
  </g>
</svg>
