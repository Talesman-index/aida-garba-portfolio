<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dark Obsidian Luxury Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="60%" stop-color="#070A14"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>

    <!-- Electric Cyan & Royal Blue Border -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#0055FF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Ambient Core Glow -->
    <radialGradient id="ambientGlow" cx="45%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#0055FF" stop-opacity="0.28"/>
      <stop offset="50%" stop-color="#00D2FF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#070A14" stop-opacity="0"/>
    </radialGradient>

    <!-- Brilliant White Monogram Gradient -->
    <linearGradient id="whiteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>

    <!-- Vibrant Electric Cyan Sparkle Star -->
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="50%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#0055FF"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="8"/>

  <!-- Ambient Light Sphere -->
  <circle cx="240" cy="256" r="210" fill="url(#ambientGlow)"/>

  <!-- Architectural Precision Monogram 'A' (Optically Balanced) -->
  <path d="M 106 400 
           L 208 128 
           C 213 114, 235 114, 240 128 
           L 342 400 
           H 280 
           L 259 342 
           H 189 
           L 168 400 
           Z 
           M 205 292 
           H 243 
           L 224 198 
           Z" 
        fill="url(#whiteGrad)"/>

  <!-- Aïda Signature 4-Pointed Sparkle Star (Curiosity & Innovation) -->
  <path d="M 362 94 
           Q 362 144 412 144 
           Q 362 144 362 194 
           Q 362 144 312 144 
           Q 362 144 362 94 Z" 
        fill="url(#starGrad)" 
        filter="url(#glow)"/>

  <!-- Secondary Dynamic Micro Sparkle Star -->
  <path d="M 420 206 
           Q 420 225 439 225 
           Q 420 225 420 244 
           Q 420 225 401 225 
           Q 420 225 420 206 Z" 
        fill="#38BDF8" 
        opacity="0.9"/>
</svg>